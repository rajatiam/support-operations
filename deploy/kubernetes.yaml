apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: 04-support-desk-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: 04-support-desk
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: 04-support-desk
  template:
    metadata:
      labels:
        app: 04-support-desk
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: 04-support-desk:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8104
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8104
          livenessProbe:
            httpGet:
              path: /health
              port: 8104
            initialDelaySeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: 04-support-desk-data
---
apiVersion: v1
kind: Service
metadata:
  name: 04-support-desk
spec:
  selector:
    app: 04-support-desk
  ports:
    - port: 80
      targetPort: 8104
